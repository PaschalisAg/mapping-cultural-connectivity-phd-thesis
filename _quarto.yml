project:
  type: book
  output-dir: _book

book:
  title: "Mapping Cultural Connectivity: Network and Embeddings Analysis Applied to English Wikipedia's Internal Link Structure"
  page-footer: "Mapping Cultural Connectivity: Network and Embeddings Analysis Applied to English Wikipedia's Internal Link Structure was written by Paschalis Agapitos and supervised by Dr. Gustavo Ariel Schwartz and Dr. Juan Luis Suarez."
  author: "Paschalis Agapitos"
  cover-image: media/cover.png
  date: "10/14/2026"
  search: true

  site-url: "https://PaschalisAg.github.io/mapping-cultural-connectivity-phd-thesis/"
  repo-url: "https://github.com/PaschalisAg/mapping-cultural-connectivity-phd-thesis"
  repo-branch: main
  repo-actions: [source, issue]

  chapters:
    - index.qmd
    - abstract.qmd
    - objective.qmd
    - introduction.qmd
    - methodology.qmd
    - wp-as-cultural-lens.qmd
    - temporal-semantic-patterns-in-wp-bios.qmd
    - conclusions-limitations-future-work.qmd

bibliography: references.bib

format:
  html:
    theme: litera
    link-citations: true
    toc: true
    syntax-highlighting: pygments
    number-sections: false
    html-math-method: mathjax
    cover-image: media/cover.png