name: Publish Quarto thesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Render HTML, PDF, and EPUB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        env:
          # remember not to replace with a literal token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render all configured formats
        run: quarto render --to all

      - name: Verify downloadable files
        shell: bash
        run: |
          test -s _book/mapping-cultural-connectivity-phd-thesis.pdf
          test -s _book/mapping-cultural-connectivity-phd-thesis.epub

      - name: Upload rendered book
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@v4